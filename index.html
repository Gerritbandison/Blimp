<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blimp — IT Asset Management Platform" />
    <!--
      Content Security Policy
      Tighten for production: replace 'unsafe-inline' with nonces once Tailwind
      inline styles are replaced by a build-time stylesheet, and set a report-uri.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' http://localhost:* https://graph.microsoft.com https://*.ninjarmm.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700,800&display=swap" />
    <title>Blimp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
