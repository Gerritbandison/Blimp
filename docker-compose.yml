version: "3.9"

# ── Required secrets ──────────────────────────────────────────────────────────
# Copy .env.docker.example → .env.docker, fill in values, then run:
#   docker compose --env-file .env.docker up
#
#   POSTGRES_PASSWORD  strong random password for the database
#   JWT_SECRET         64-char random string: openssl rand -hex 32
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Copy .env.docker.example to .env.docker}
      POSTGRES_DB: blimp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blimp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ──────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blimp:${POSTGRES_PASSWORD:?}@db:5432/blimp?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set. Copy .env.docker.example to .env.docker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3001:3001"

  # ── Frontend (Vite dev server) ───────────────────────────────────────────────
  # Uncomment to run the frontend in Docker instead of locally:
  #
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       VITE_API_BASE_URL: http://localhost:3001
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - server

volumes:
  pgdata:
